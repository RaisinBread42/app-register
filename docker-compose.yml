# Local Postgres for development. Not used by unit tests (they run on PGlite).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: app_register
      POSTGRES_PASSWORD: app_register_local
      POSTGRES_DB: app_register
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_register -d app_register']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
