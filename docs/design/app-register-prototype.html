let current='overview',selectedApp='customer-portal',appQuery='',appType='all',appHealth='all',appSort='score',noticeFilter='open',noticeCategory='all',noticeApp='all',sourceFilter='all',sourceQuery='',detailTab='overview';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const healthClass=s=>s<80?'critical':s<95?'attention':'ok';
const score=s=>`<span class="score ${healthClass(s)}">${s}</span>`;
const badge=(label,kind='purple')=>`<span class="badge ${kind}">${esc(label)}</span>`;
const status=s=>s==='na'?`<span class="check-pill na" title="Not monitored / not applicable">—</span>`:`<span class="check-pill ${s}">${s==='ok'?'✓':s==='critical'?'!':'!'} <span>${s==='ok'?'OK':s==='critical'?'Critical':'Attention'}</span></span>`;
const applogo=a=>`<div class="app-icon ${a.color}">${esc(a.logo)}</div>`;
const appCell=a=>`<div class="app-name">${applogo(a)}<div><div class="name">${esc(a.name)}</div><div class="sub">${esc(a.category)}</div></div></div>`;
const appFor=id=>apps.find(x=>x.id===id);
const title=(name,sub,actions='')=>`<div class="page-heading"><div><h1>${name}</h1><p>${sub}</p></div>${actions}</div>`;
const metric=(name,n,desc,ic='box',kind='')=>`<div class="metric"><div><div class="metric-label">${name}</div><div class="metric-number">${n}</div><small>${desc}</small></div><div class="metric-icon ${kind}">${icon(ic,21)}</div></div>`;
const card=(name,subtitle,body,action='')=>`<section class="card"><div class="card-header"><div><h2>${name}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${action}</div><div class="card-body">${body}</div></section>`;
const asLink=(label,page)=>`<button class="link" onclick="navigate('${page}')">${label} →</button>`;
const dueDate=v=>v?new Date(v+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
const summaryNotices=()=>notices.filter(n=>n.status==='open'&&n.severity!=='info');
function overview(){const sorted=[...apps].sort((a,b)=>a.score-b.score),avg=Math.round(apps.reduce((t,a)=>t+a.score,0)/apps.length),open=summaryNotices();const distribution=[['95–100',apps.filter(a=>a.score>=95).length,'#35AC70'],['80–94',apps.filter(a=>a.score>=80&&a.score<95).length,'#EDB04E'],['Below 80',apps.filter(a=>a.score<80).length,'#DF6677']];return title('Overview','Your application inventory, health and upcoming obligations.',`<button class="btn primary" onclick="openModal()">+ Add application</button>`)+`<div class="grid metrics five">${metric('Average health score',avg+' <span style="font-size:15px;color:#8A8295">/ 100</span>','Based on tracked apps','shield','green')}${metric('Total applications',apps.length,'SaaS and custom','apps')}${metric('Healthy applications',apps.filter(a=>a.score>=95).length,'Score of 95 or above','check','green')}${metric('Upcoming renewals',apps.filter(a=>a.renewal).length,'Scheduled licence dates','calendar','amber')}${metric('Need attention',apps.filter(a=>a.score<95).length,'Health score below 95','warning','red')}</div><div class="content-grid"><div class="stack">${card('Applications needing attention','Lowest health scores first',`<div class="table-wrap"><table class="table"><thead><tr><th>Application</th><th>Health</th><th>Key issue</th><th></th></tr></thead><tbody>${sorted.filter(a=>a.score<100).slice(0,5).map(a=>`<tr class="clickable" onclick="openApp('${a.id}')"><td>${appCell(a)}</td><td>${score(a.score)}</td><td><span class="badge ${a.score<80?'red':'amber'}">${esc(a.deductions[0]?.[2]||'Notice')}</span><div class="sub" style="margin-top:5px">${esc(a.deductions[0]?.[0]||'No issues')}</div></td><td style="color:var(--brand)">${icon('arrow',16)}</td></tr>`).join('')}</tbody></table></div>`,asLink('View all applications','applications'))}${card('Recent application updates','Latest changes across your tracked applications',`<div class="notice-list">${notices.slice(0,4).map(n=>`<div class="notice-row"><span class="notice-symbol ${n.severity==='critical'?'red':n.severity==='attention'?'amber':''}">${icon(n.symbol,18)}</span><div class="notice-info"><strong>${esc(n.title)}</strong><p>${esc(appFor(n.app)?.name)} · ${esc(n.age)}</p></div>${badge(n.severity==='critical'?'Critical':n.severity==='attention'?'Attention':'Info',n.severity==='critical'?'red':n.severity==='attention'?'amber':'purple')}</div>`).join('')}</div>`,asLink('All notices','notices'))}</div><div class="stack">${card('Health distribution','Across the entire application catalog',distribution.map(d=>`<div class="dist-row"><span class="range">${d[0]}</span><div class="bar-track"><div class="bar-fill" style="width:${d[1]/apps.length*100}%;background:${d[2]}"></div></div><span class="qty">${d[1]}</span></div>`).join(''))}${card('Upcoming renewals','Licence and subscription dates',apps.filter(a=>a.renewal).sort((a,b)=>a.renewal.localeCompare(b.renewal)).slice(0,5).map(a=>`<div class="notice-row" style="align-items:center"><span class="notice-symbol amber">${icon('calendar',18)}</span><div class="notice-info"><strong>${esc(a.name)} renewal</strong><p>${dueDate(a.renewal)}</p></div>${badge('Renewal','amber')}</div>`).join(''))}${card('Monitoring coverage','Source health at a glance',`<div class="score-feature"><div class="score-big">${sources.filter(s=>s.status==='healthy').length}<span> / ${sources.length}</span></div><div><strong>Sources checking successfully</strong><p class="muted" style="font-size:11px">A healthy app score should also have fresh monitoring evidence.</p></div></div>`,asLink('View sources','sources'))}</div></div>`}
function applications(){let data=apps.filter(a=>(appType==='all'||a.type===appType)&&(appHealth==='all'||appHealth==='attention'&&a.score<95||appHealth==='healthy'&&a.score>=95)&&a.name.toLowerCase().includes(appQuery.toLowerCase()));data.sort((a,b)=>appSort==='name'?a.name.localeCompare(b.name):appSort==='renewal'?(a.renewal||'9999').localeCompare(b.renewal||'9999'):a.score-b.score);return title('Applications',"Your company’s application inventory, health and key dates.",`<button class="btn primary" onclick="openModal()">+ Add application</button>`)+`<div class="grid metrics">${metric('Total applications',apps.length,'All tracked applications','apps')}${metric('Average health',Math.round(apps.reduce((t,a)=>t+a.score,0)/apps.length)+' / 100','Across your inventory','shield','green')}${metric('Need attention',apps.filter(a=>a.score<95).length,'Applications below 95','warning','red')}${metric('With licence dates',apps.filter(a=>a.renewal).length,'Tracked renewals','calendar','amber')}</div><div class="card"><div class="filters"><input id="appSearch" class="field search" placeholder="Search applications…" value="${esc(appQuery)}" oninput="appQuery=this.value;refreshTable()" aria-label="Search applications"><select class="field" onchange="appType=this.value;refreshTable()"><option value="all" ${appType==='all'?'selected':''}>All types</option><option ${appType==='SaaS'?'selected':''}>SaaS</option><option ${appType==='Custom'?'selected':''}>Custom</option></select><select class="field" onchange="appHealth=this.value;refreshTable()"><option value="all">All health</option><option value="attention" ${appHealth==='attention'?'selected':''}>Needs attention</option><option value="healthy" ${appHealth==='healthy'?'selected':''}>Healthy</option></select><span class="spacer"></span><select class="field" onchange="appSort=this.value;refreshTable()"><option value="score" ${appSort==='score'?'selected':''}>Health (lowest)</option><option value="name" ${appSort==='name'?'selected':''}>Name (A–Z)</option><option value="renewal" ${appSort==='renewal'?'selected':''}>Renewal (soonest)</option></select></div><div id="appsTable">${appsTableMarkup(data)}</div></div><p class="foot-note">Illustrative sample data. Statuses shown as N/A indicate the check is not relevant or not configured for that application.</p>`}
function appsTableMarkup(data){return `<div class="table-wrap"><table class="table"><thead><tr><th>Application</th><th>Type</th><th>Owner</th><th>Health ↑</th><th>Dependencies</th><th>Hosting</th><th>Licence</th><th>Pricing</th><th>Renewal</th></tr></thead><tbody>${data.map(a=>`<tr class="clickable" onclick="openApp('${a.id}')"><td>${appCell(a)}</td><td>${badge(a.type,'purple')}</td><td>${esc(a.owner)}</td><td>${score(a.score)}</td><td>${status(a.deps)}</td><td>${status(a.host)}</td><td>${status(a.lic)}</td><td>${status(a.price)}</td><td style="white-space:nowrap">${dueDate(a.renewal)}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">No applications match your filters.</td></tr>'}</tbody></table></div><div class="section-caption" style="padding:0 18px 15px">Showing ${data.length} of ${apps.length} applications · Click a row to open details</div>`}
function refreshTable(){const active=document.activeElement;let data=apps.filter(a=>(appType==='all'||a.type===appType)&&(appHealth==='all'||appHealth==='attention'&&a.score<95||appHealth==='healthy'&&a.score>=95)&&a.name.toLowerCase().includes(appQuery.toLowerCase()));data.sort((a,b)=>appSort==='name'?a.name.localeCompare(b.name):appSort==='renewal'?(a.renewal||'9999').localeCompare(b.renewal||'9999'):a.score-b.score);document.getElementById('appsTable').innerHTML=appsTableMarkup(data)}
function openApp(id){selectedApp=id;detailTab='overview';navigate('detail')}
function detail(){const a=appFor(selectedApp);if(!a)return applications();const related=notices.filter(n=>n.app===a.id);return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><button class="link" onclick="navigate('applications')">← All applications</button><button class="btn" onclick="toast('Editing application metadata is a UI placeholder')">✎ Edit application</button></div><section class="card detail-hero"><div class="detail-top"><div class="detail-identity">${applogo(a)}<div><h1>${esc(a.name)}</h1><p class="muted">${esc(a.description)}</p><div style="margin-top:9px;display:flex;gap:7px">${badge(a.type)}${badge(a.vendor,'gray')}</div></div></div><div><span class="muted" style="font-size:11px">HEALTH SCORE</span><div class="score-big" style="color:${a.score<80?'var(--red)':a.score<95?'var(--amber)':'var(--green)'}">${a.score}<span> / 100</span></div>${badge(a.score>=95?'Healthy':'Needs attention',a.score>=95?'green':a.score<80?'red':'amber')}</div></div><div class="detail-meta"><div><span class="meta-label">Category</span><strong>${esc(a.category)}</strong></div><div><span class="meta-label">Owner</span><strong>${esc(a.owner)}</strong></div><div><span class="meta-label">Renewal date</span><strong>${dueDate(a.renewal)}</strong></div><div><span class="meta-label">Hosting</span><strong>${esc(a.hosting)}</strong></div></div></section><div class="section-tabs">${[['overview','Overview'],['dependencies','Dependencies'],['hosting','Hosting & infrastructure'],['licence','Licence & pricing'],['notices','Notices ('+related.length+')']].map(([id,label])=>`<button class="tab ${detailTab===id?'active':''}" onclick="detailTab='${id}';render()">${label}</button>`).join('')}</div>${detailBody(a,related)}`}
function detailBody(a,related){if(detailTab==='overview')return `<div class="detail-layout"><div class="stack">${card('Health breakdown','How the 0–100 score is calculated',`<div class="deduction"><div><strong>Starting score</strong><p>All supported checks assumed clear in this demonstration</p></div><strong>100 pts</strong></div>${a.deductions.map(d=>`<div class="deduction"><div><strong>${esc(d[0])}</strong><p>${esc(d[2])}</p></div><span class="points">${d[1]} pts</span></div>`).join('')||'<div class="deduction"><strong>No active deductions</strong><span style="color:var(--green)">✓</span></div>'}<div class="deduction"><strong>Current health score</strong>${score(a.score)}</div>`)}${card('Recent notices','Updates related to this application',related.map(n=>`<div class="notice-row"><div class="notice-symbol ${n.severity==='critical'?'red':'amber'}">${icon(n.symbol)}</div><div class="notice-info"><strong>${esc(n.title)}</strong><p>${esc(n.age)} · ${esc(n.category)}</p></div>${badge(n.severity,n.severity==='critical'?'red':n.severity==='attention'?'amber':'purple')}</div>`).join('')||'<div class="empty">No notices for this application.</div>',`<button class="link" onclick="detailTab='notices';render()">View all →</button>`)}</div><div class="stack">${card('Current status','Status by monitored dimension',`<div class="status-line"><label>Dependencies</label>${status(a.deps)}</div><div class="status-line"><label>Hosting & infrastructure</label>${status(a.host)}</div><div class="status-line"><label>Licence</label>${status(a.lic)}</div><div class="status-line"><label>Pricing</label>${status(a.price)}</div>`)}${card('Key details','Application record',`<div class="kv"><span>Vendor</span><strong>${esc(a.vendor)}</strong></div><div class="kv"><span>Type</span><strong>${esc(a.type)}</strong></div><div class="kv"><span>Owner</span><strong>${esc(a.owner)}</strong></div><div class="kv"><span>Category</span><strong>${esc(a.category)}</strong></div><div class="kv"><span>Hosting</span><strong>${esc(a.hosting)}</strong></div><div class="kv"><span>Renewal</span><strong>${dueDate(a.renewal)}</strong></div><div class="kv"><span>Monitoring</span>${badge('Demo data','purple')}</div>`)}</div></div>`;
if(detailTab==='notices')return card('Application notices',`${related.length} updates associated with ${esc(a.name)}`,related.map(n=>`<div class="notice-row"><div class="notice-symbol ${n.severity==='critical'?'red':'amber'}">${icon(n.symbol)}</div><div class="notice-info"><strong>${esc(n.title)}</strong><p>${esc(n.description)} · ${esc(n.age)}</p></div>${badge(n.status,n.status==='resolved'?'green':'amber')}</div>`).join('')||'<div class="empty">No notices found.</div>');
if(detailTab==='dependencies')return card('Dependencies','Frameworks, packages, versions, security advisories and end-of-life notices',a.type==='SaaS'?'<div class="empty">Vendor-managed SaaS: package-level dependencies are not available in this sample.</div>':`<div class="table-wrap"><table class="table"><thead><tr><th>Dependency</th><th>Tracked version</th><th>Latest available</th><th>Status</th></tr></thead><tbody><tr><td>Next.js</td><td>14.2.x</td><td>15.x</td><td>${status(a.deps)}</td></tr><tr><td>Node.js</td><td>20.x</td><td>22.x</td><td>${status(a.deps)}</td></tr><tr><td>React</td><td>18.x</td><td>19.x</td><td>${badge('Update available','amber')}</td></tr></tbody></table></div><p class="section-caption">Example versions only; not live registry data.</p>`);
if(detailTab==='hosting')return card('Hosting & infrastructure','Providers, services, regions and relevant platform notices',`<div class="kv"><span>Primary hosting</span><strong>${esc(a.hosting)}</strong></div><div class="kv"><span>Region</span><strong>${a.type==='Custom'?'East US (sample)':'Vendor-managed'}</strong></div><div class="kv"><span>Infrastructure status</span>${status(a.host)}</div><div class="kv"><span>Monitoring sources</span><strong>Provider status feed</strong></div><p class="section-caption">Cloud service associations are illustrative.</p>`);
return card('Licence & pricing','Renewal details, notice deadlines and vendor pricing changes',`<div class="kv"><span>Vendor</span><strong>${esc(a.vendor)}</strong></div><div class="kv"><span>Renewal date</span><strong>${dueDate(a.renewal)}</strong></div><div class="kv"><span>Licence status</span>${status(a.lic)}</div><div class="kv"><span>Pricing status</span>${status(a.price)}</div><div class="kv"><span>Notice period</span><strong>Not configured</strong></div><p class="section-caption">Add contract terms and renewal reminder rules during implementation.</p>`)}
function noticePage(){let filtered=notices.filter(n=>(noticeFilter==='all'||n.status===noticeFilter||noticeFilter==='attention'&&n.status==='open'&&n.severity!=='info')&&(noticeCategory==='all'||n.category===noticeCategory)&&(noticeApp==='all'||n.app===noticeApp));const options=(items,value)=>items.map(x=>`<option value="${esc(x)}" ${value===x?'selected':''}>${esc(x)}</option>`).join('');return title('Notices','Updates and changes across your applications, licences, dependencies and infrastructure.')+`<div class="grid metrics">${metric('Needs attention',summaryNotices().length,'Open review items','warning','red')}${metric('Licence updates',notices.filter(n=>n.category==='Licence').length,'Contract and renewal reminders','calendar')}${metric('Dependency notices',notices.filter(n=>['Dependencies','Security'].includes(n.category)).length,'Updates and advisories','box')}${metric('Provider changes',notices.filter(n=>n.category==='Hosting').length,'Status and platform updates','cloud')}</div><div class="card"><div class="section-tabs" style="padding:0 15px;margin:0">${[['open','Open'],['attention','Needs attention'],['all','All notices'],['acknowledged','Acknowledged'],['snoozed','Snoozed'],['resolved','Resolved']].map(([key,label])=>`<button class="tab ${noticeFilter===key?'active':''}" onclick="noticeFilter='${key}';render()">${label}</button>`).join('')}</div><div class="filters"><select class="field" onchange="noticeApp=this.value;render()"><option value="all">All applications</option>${apps.map(a=>`<option value="${a.id}" ${noticeApp===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select><select class="field" onchange="noticeCategory=this.value;render()"><option value="all">All categories</option>${['Security','Dependencies','Hosting','Licence','Pricing'].map(c=>`<option ${noticeCategory===c?'selected':''}>${c}</option>`).join('')}</select><span class="spacer"></span><span class="muted">${filtered.length} notices shown</span></div><div class="notice-feed">${filtered.map(n=>`<div class="feed-entry"><div class="notice-symbol ${n.severity==='critical'?'red':n.severity==='attention'?'amber':n.status==='resolved'?'green':''}">${icon(n.symbol,19)}</div><div class="notice-info"><strong>${esc(n.title)}</strong> ${badge(n.severity==='critical'?'Critical':n.severity==='attention'?'Attention':'Informational',n.severity==='critical'?'red':n.severity==='attention'?'amber':'purple')}<p>${esc(n.description)}</p><p><a class="link" href="#/detail/${n.app}">${esc(appFor(n.app)?.name)}</a> · ${esc(n.category)}</p><div class="feed-actions" style="margin-top:11px">${n.status!=='acknowledged'?`<button onclick="updateNotice(${n.id},'acknowledged')">✓ Acknowledge</button>`:''}${n.status!=='snoozed'?`<button onclick="updateNotice(${n.id},'snoozed')">◷ Snooze</button>`:''}${n.status!=='resolved'?`<button onclick="updateNotice(${n.id},'resolved')">✓ Resolve</button>`:''}${n.status!=='open'?`<button onclick="updateNotice(${n.id},'open')">Reopen</button>`:''}</div></div><div class="feed-meta"><small>${esc(n.age)}</small>${badge(n.status,n.status==='resolved'?'green':'gray')}</div></div>`).join('')||'<div class="empty">No notices match these filters.</div>'}</div></div><p class="foot-note">Prototype notice actions only change local in-memory status. Acknowledging or snoozing does not alter the sample health score.</p>`}
function sourcesPage(){let filtered=sources.filter(s=>(sourceFilter==='all'||s.type===sourceFilter)&&s.name.toLowerCase().includes(sourceQuery.toLowerCase()));return title('Monitoring sources','The external APIs and websites watched for advisories, updates, pricing changes and service status.',`<button class="btn primary" onclick="toast('Connect source is a UI placeholder')">+ Connect source</button>`)+`<div class="grid metrics">${metric('Total sources',sources.length,'Tracked external sources','sources')}${metric('Healthy sources',sources.filter(s=>s.status==='healthy').length,'Checks running successfully','check','green')}${metric('Needs attention',sources.filter(s=>s.status==='attention').length,'Check failures or stale data','warning','amber')}${metric('Applications monitored',apps.length,'Connected catalog items','apps')}</div><div class="card"><div class="filters"><input class="field search" placeholder="Search sources…" value="${esc(sourceQuery)}" oninput="sourceQuery=this.value;document.getElementById('sourceTable').innerHTML=sourcesTableMarkup(sources.filter(s=>(sourceFilter==='all'||s.type===sourceFilter)&&s.name.toLowerCase().includes(sourceQuery.toLowerCase())))"><select class="field" onchange="sourceFilter=this.value;render()"><option value="all">All source types</option>${['Security','Packages','Cloud & hosting','Vendors & pricing'].map(c=>`<option ${sourceFilter===c?'selected':''}>${c}</option>`).join('')}</select></div><div id="sourceTable">${sourcesTableMarkup(filtered)}</div></div><p class="foot-note">Monitoring states and timestamps are mock data. Real production integrations need retry handling, last-success timestamps and stale-source rules.</p>`}
function sourcesTableMarkup(data){return `<div class="table-wrap"><table class="table"><thead><tr><th>Source</th><th>Type</th><th>Connected applications</th><th>Last checked</th><th>Status</th><th></th></tr></thead><tbody>${data.map(s=>`<tr><td><div class="app-name"><div class="source-logo">${esc(s.logo)}</div><div><div class="name">${esc(s.name)}</div><div class="sub">${esc(s.url)}</div></div></div></td><td>${badge(s.type,s.type==='Security'?'red':s.type==='Cloud & hosting'?'blue':'purple')}</td><td>${s.apps} applications</td><td>${esc(s.last)}</td><td>${badge(s.status==='healthy'?'● Monitoring':'! Needs attention',s.status==='healthy'?'green':'amber')}</td><td><button class="btn small" onclick="toast('Source configuration is a UI placeholder')">⋯</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No sources match.</td></tr>'}</tbody></table></div>`}
function settingsPage(){return title('Settings','Workspace configuration and product preferences.')+card('Prototype settings','A few implementation notes for your development handoff',`<div class="kv"><span>Brand purple</span><strong>#612CCC</strong></div><div class="kv"><span>Sidebar</span><strong>#130F1C</strong></div><div class="kv"><span>Headings</span><strong>Poppins</strong></div><div class="kv"><span>Body font</span><strong>Inter</strong></div><div class="kv"><span>Data</span>${badge('Demo only','amber')}</div><div class="kv"><span>Frontend</span><strong>Vanilla HTML, CSS, JavaScript</strong></div>`) }
function render(){let html=current==='overview'?overview():current==='applications'?applications():current==='detail'?detail():current==='notices'?noticePage():current==='sources'?sourcesPage():settingsPage();document.getElementById('screen').innerHTML=html;document.getElementById('breadcrumb').textContent='Workspace / '+(current==='detail'?'Applications / '+(appFor(selectedApp)?.name||'Details'):current[0].toUpperCase()+current.slice(1));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===(current==='detail'?'applications':current)));document.getElementById('navNoticeCount').textContent=notices.filter(n=>n.status==='open').length;document.title=(current==='detail'?(appFor(selectedApp)?.name||'Application'):current[0].toUpperCase()+current.slice(1))+' · App Register';}
function navigate(page){current=page;history.replaceState(null,'',`#/${page}`);document.getElementById('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'})}
function updateNotice(id,value){const n=notices.find(x=>x.id===id);if(n){n.status=value;render();toast('Notice '+value+' (prototype only)')}}
function openModal(){document.getElementById('modalShell').classList.add('open');setTimeout(()=>document.getElementById('newAppName').focus(),50)}
function closeModal(){document.getElementById('modalShell').classList.remove('open')}
function addApp(e){e.preventDefault();const name=document.getElementById('newAppName').value.trim();if(!name)return;const type=document.getElementById('newAppType').value;let id='app-'+Math.random().toString(36).slice(2,9);apps.push({id,name,type,category:document.getElementById('newAppCategory').value.trim()||'Uncategorized',owner:document.getElementById('newAppOwner').value.trim()||'Unassigned',logo:name.slice(0,2).toUpperCase(),color:'blue',score:100,renewal:null,vendor:type==='SaaS'?'Not specified':'Internal',hosting:type==='SaaS'?'Vendor-managed':'Not specified',deps:type==='SaaS'?'na':'ok',host:'ok',lic:'na',price:'na',description:'New application record',deductions:[]});document.getElementById('appForm').reset();closeModal();navigate('applications');toast('Sample application added locally')}
let toastTimeout;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.remove('show'),3000)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();navigate('applications');document.getElementById('appSearch')?.focus()}});
window.addEventListener('hashchange',()=>{const parts=location.hash.replace(/^#\//,'').split('/');if(parts[0]==='detail'&&appFor(parts[1])){selectedApp=parts[1];current='detail'}else if(['overview','applications','notices','sources','settings'].includes(parts[0]))current=parts[0];render()});
const initial=location.hash.replace(/^#\//,'').split('/');if(initial[0]==='detail'&&appFor(initial[1])){selectedApp=initial[1];current='detail'}else if(['overview','applications','notices','sources','settings'].includes(initial[0]))current=initial[0];render();
</script>
</body>
</html>
