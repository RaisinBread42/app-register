# Same checks as the local hook, on every PR.
name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      # Unit tests use PGlite; this real Postgres only proves the migrations apply.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app_register
          POSTGRES_PASSWORD: app_register_ci
          POSTGRES_DB: app_register
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_register -d app_register"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint, type check, tests
        run: bash scripts/gate.sh

      - name: Apply migrations to Postgres 18 (twice, to prove re-running is a no-op)
        env:
          DATABASE_URL: postgres://app_register:app_register_ci@localhost:5432/app_register
        run: |
          npm run db:migrate
          npm run db:migrate
          test "$(psql "$DATABASE_URL" -Atc 'select count(*) from drizzle.__drizzle_migrations')" = \
               "$(node -p 'require("./drizzle/meta/_journal.json").entries.length')"

      - name: Notice syncs under real concurrency (PGlite is single-connection)
        env:
          TEST_POSTGRES_URL: postgres://app_register:app_register_ci@localhost:5432/app_register
        run: npx vitest run src/lib/services/notices-concurrency.adversarial.test.ts

      - name: Flag magic strings
        if: github.event_name == 'pull_request'
        run: |
          if ! out="$(bash scripts/magic-strings.sh "origin/${{ github.base_ref }}")"; then
            echo "::warning::This PR adds possible magic strings. Use named constants, or justify them in the PR."
            { echo "## Possible magic strings"; echo; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Flag database migrations
        if: github.event_name == 'pull_request'
        run: |
          . .claude/gate.conf
          [ -z "${MIGRATIONS_PATH:-}" ] && exit 0
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- "$MIGRATIONS_PATH" || true)"
          if [ -n "$changed" ]; then
            echo "::warning::This PR changes database migrations. A human must review them."
            { echo "## Database migrations changed"; echo; echo "$changed" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app_register
          POSTGRES_PASSWORD: app_register_ci
          POSTGRES_DB: app_register
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_register -d app_register"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Journeys, accessibility (axe) and screenshots on seeded demo data
        env:
          DATABASE_URL: postgres://app_register:app_register_ci@localhost:5432/app_register
        run: npm run e2e

      - name: Summarise e2e in the job summary
        if: always()
        run: node scripts/e2e-summary.mjs e2e-artifacts/report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          retention-days: 14

  ensure-mvp-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Ensure mvp label and tag MVP issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create mvp --color 0E8A16 --description "MVP scope" 2>/dev/null || true
          # Tag open issues whose title starts with [NN]
          gh issue list --state open --limit 100 --json number,title,labels \
            --jq '.[] | select(.title | test("^\\[[0-9]+\\]")) | select([.labels[].name] | index("mvp") | not) | .number' \
            | while read -r n; do
                [ -n "$n" ] || continue
                gh issue edit "$n" --add-label mvp || true
              done
